name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows-exe.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: kkingg-reserves-windows
          path: |
            desktop/dist/kkingg-reserves-setup.exe
            desktop/dist/kkingg-reserves-portable.exe
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --title "Windows app (latest)" --notes "Windows installer and portable exe for kkingg reserves." --target "$GITHUB_SHA"
          gh release upload desktop-latest kkingg-reserves-setup.exe kkingg-reserves-portable.exe --clobber
