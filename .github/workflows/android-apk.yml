name: Android APK

# Builds an installable Android APK of kkingg reserves and publishes it on the Releases page.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install and sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Name the APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk kkingg-reserves.apk
      - uses: actions/upload-artifact@v4
        with: { name: kkingg-reserves-apk, path: kkingg-reserves.apk }
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Android build of kkingg reserves (commit ${GITHUB_SHA::7}). Download kkingg-reserves.apk on your phone and open it. You may need to allow installs from your browser or file manager when Android asks."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest kkingg-reserves.apk --clobber
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest kkingg-reserves.apk --title "kkingg reserves for Android" --notes "$NOTES" --latest
          fi
